name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,web,plot]"
      - name: Ruff (lint)
        run: ruff check src tests app.py
      - name: Ruff (format)
        run: ruff format --check src tests app.py
      - name: Mypy
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,web,plot]"
      - name: Pytest
        run: pytest --cov --cov-report=term --cov-report=xml
      - name: Pipeline benchmark on synthetic ground truth
        run: cell-identifier benchmark --count 3 --seed 0

  package:
    name: Build & smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11" # matches the Render deployment
          cache: pip
      - name: Build
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install "$(ls dist/*.whl)[web]"
      - name: Smoke test
        working-directory: /tmp
        run: |
          /tmp/wheel-env/bin/cell-identifier --version
          /tmp/wheel-env/bin/python -c "
          from cell_identifier.web import create_app
          client = create_app().test_client()
          assert client.get('/').status_code == 200
          response = client.post('/api/analyze', json={'sample': True})
          assert response.status_code == 200, response.get_json()
          print('cells in sample:', response.get_json()['cell_count'])
          "
